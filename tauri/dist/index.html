<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Styled like pinged's widgets (grid, glow shadows) with DOM and CSS. canvas.html draws the
     reference look (widget.js) instead. -->
<style>
  :root { --accent: #50ff78; --bg: #030a03; }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 12px monospace; color: var(--accent); }
  .panel { position: fixed; inset: 0; box-sizing: border-box; padding: 8px 10px; border-radius: 4px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: linear-gradient(color-mix(in srgb, var(--accent) 6%, transparent) 1px, transparent 1px) 0 0 / 100% 12px,
      linear-gradient(90deg, color-mix(in srgb, var(--accent) 6%, transparent) 1px, transparent 1px) 0 0 / 12px 100%,
      color-mix(in srgb, var(--bg) 25%, transparent);
    box-shadow: inset 0 0 24px color-mix(in srgb, var(--accent) 8%, transparent); }
  .title { text-shadow: 0 0 6px var(--accent); margin-bottom: 4px; }
  .row { display: flex; gap: 8px; }
  .pie { width: 40px; height: 40px; margin: 2px; border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    background: conic-gradient(color-mix(in srgb, var(--accent) 60%, transparent) calc(var(--f) * 360deg), transparent 0); }
  .val { text-align: center; text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
</style>
</head>
<body>
<script>
  // BENCH_N set: overlay mode, n panels placed inside one window; otherwise one panel filling this window
  const n = window.BENCH_N || 0;
  const motors = [];
  for (let p = 0; p < Math.max(n, 1); p++) {
    const panel = document.body.appendChild(Object.assign(document.createElement("div"), { className: "panel" }));
    if (n) Object.assign(panel.style, { inset: "auto", width: "240px", height: "110px",
      left: 40 + 260 * (p % 4) + "px", top: 40 + 140 * Math.floor(p / 4) + "px" });
    panel.appendChild(Object.assign(document.createElement("div"), { className: "title", textContent: "MOTORS" }));
    const row = panel.appendChild(Object.assign(document.createElement("div"), { className: "row" }));
    for (let i = 0; i < 4; i++) motors.push(addMotor(row));
  }
  function addMotor(row) {
    const col = row.appendChild(document.createElement("div"));
    return { pie: col.appendChild(Object.assign(document.createElement("div"), { className: "pie" })),
             val: col.appendChild(Object.assign(document.createElement("div"), { className: "val" })) };
  }
  const start = performance.now();
  let frames = 0, last = start, first = true;
  function tick(now) {
    const t = window.BENCH_FREEZE ?? (now - start) / 1000; // frozen for screenshots
    motors.forEach((m, i) => {
      const f = 0.5 + 0.45 * Math.sin(t * 1.3 + i % 4); // fake PWM
      m.pie.style.setProperty("--f", f);
      m.val.textContent = Math.round(1000 + f * 1000);
    });
    if (first) { window.__TAURI__.core.invoke("first_frame"); first = false; }
    frames++;
    if (now - last >= 1000) {
      window.__TAURI__.core.invoke("fps", { n: frames * 1000 / (now - last) });
      frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
