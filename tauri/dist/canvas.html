<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The reference look (widget.js) on one <canvas>. The static parts are drawn once into an
     offscreen canvas; each frame only clears, blits, and draws the wedges and numbers. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="space-mono.js"></script>
<script src="widget.js"></script>
<script>
  const { W, H, MARGIN: M } = Widget;
  const n = window.BENCH_N || 0; // set: overlay mode, n panels in one window; else one panel
  const freeze = window.BENCH_FREEZE; // set: draw this instant forever (for screenshots)
  const dpr = devicePixelRatio || 1;
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  function fit() {
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
  }
  fit();
  addEventListener("resize", fit);
  const pos = (p) => (n ? Widget.origin(p) : [0, 0]);

  // static parts plus the glow margin around them, drawn once
  const bg = document.createElement("canvas");
  bg.width = (W + 2 * M) * dpr; bg.height = (H + 2 * M) * dpr;

  const start = performance.now();
  let frames = 0, last = start, first = true;
  function tick(now) {
    const t = freeze ?? (now - start) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let p = 0; p < Math.max(n, 1); p++) {
      const [x, y] = pos(p);
      ctx.clearRect(x - M, y - M, W + 2 * M, H + 2 * M); // only panel areas; the rest stays empty
      ctx.drawImage(bg, x - M, y - M, W + 2 * M, H + 2 * M);
      Widget.drawDynamic(ctx, x, y, t);
    }
    if (first) { window.__TAURI__.core.invoke("first_frame"); first = false; }
    frames++;
    if (now - last >= 1000) {
      window.__TAURI__.core.invoke("fps", { n: frames * 1000 / (now - last) });
      frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  }
  Widget.ready.then(() => {
    const g = bg.getContext("2d");
    g.scale(dpr, dpr); g.translate(M, M);
    Widget.drawStatic(g);
    requestAnimationFrame(tick);
  });
</script>
</body>
</html>
